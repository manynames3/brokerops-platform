name: deploy-preview

on:
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  deploy-preview:
    runs-on: ubuntu-latest

    env:
      AWS_REGION: ${{ vars.AWS_REGION || 'us-east-1' }}
      ECR_REPOSITORY: ${{ vars.ECR_REPOSITORY || 'brokerops-platform-api' }}

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9.12.3

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_wrapper: false

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - run: pnpm install --frozen-lockfile
      - run: pnpm -r lint
      - run: pnpm -r typecheck
      - run: pnpm -r test

      - name: Ensure preview ECR repository
        run: |
          aws ecr describe-repositories --repository-names "$ECR_REPOSITORY" >/dev/null 2>&1 || \
            aws ecr create-repository \
              --repository-name "$ECR_REPOSITORY" \
              --image-scanning-configuration scanOnPush=true \
              --encryption-configuration encryptionType=AES256 \
              --tags Key=Project,Value=brokerops-platform Key=Environment,Value=preview Key=ManagedBy,Value=github-actions

      - name: Login to ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push API image
        env:
          IMAGE_URI: ${{ steps.ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:preview-${{ github.sha }}
        run: |
          docker build -f apps/api/Dockerfile -t "$IMAGE_URI" .
          docker push "$IMAGE_URI"
          echo "IMAGE_URI=$IMAGE_URI" >> "$GITHUB_ENV"

      - name: Apply preview infrastructure
        working-directory: infra/terraform/environments/preview
        env:
          TF_VAR_container_image: ${{ env.IMAGE_URI }}
          TF_VAR_database_password: ${{ secrets.PREVIEW_DATABASE_PASSWORD }}
        run: |
          terraform init
          terraform apply -auto-approve

      - name: Run preview database migrations
        run: |
          export ECS_CLUSTER_NAME="$(terraform -chdir=infra/terraform/environments/preview output -raw ecs_cluster_name)"
          export ECS_TASK_DEFINITION_ARN="$(terraform -chdir=infra/terraform/environments/preview output -raw ecs_task_definition_arn)"
          export ECS_SUBNET_IDS="$(terraform -chdir=infra/terraform/environments/preview output -raw ecs_service_subnet_ids_csv)"
          export ECS_SECURITY_GROUP_ID="$(terraform -chdir=infra/terraform/environments/preview output -raw ecs_service_security_group_id)"
          export ECS_ASSIGN_PUBLIC_IP="$(terraform -chdir=infra/terraform/environments/preview output -raw ecs_assign_public_ip)"
          bash scripts/run-ecs-migration.sh

      - name: Wait for preview service
        run: |
          aws ecs wait services-stable \
            --cluster "$(terraform -chdir=infra/terraform/environments/preview output -raw ecs_cluster_name)" \
            --services "$(terraform -chdir=infra/terraform/environments/preview output -raw ecs_service_name)"

      - name: Smoke test
        run: |
          API_URL="http://$(terraform -chdir=infra/terraform/environments/preview output -raw alb_dns_name)" bash scripts/smoke-test.sh

      - name: Capture evidence
        run: |
          API_URL="http://$(terraform -chdir=infra/terraform/environments/preview output -raw alb_dns_name)" bash scripts/capture-evidence.sh
